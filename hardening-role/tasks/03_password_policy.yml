---
# Control 03 — Password hashing algorithm (sha512) and minimum complexity
# via login.defs and pwquality.
- name: "03 precheck: login.defs exists"
  ansible.builtin.stat:
    path: /etc/login.defs
  register: login_defs_stat

- name: "03 precheck: fail loudly if login.defs missing"
  ansible.builtin.fail:
    msg: "/etc/login.defs not found — unsupported target for password policy control."
  when: not login_defs_stat.stat.exists

- name: "03 backup: login.defs"
  ansible.builtin.copy:
    src: /etc/login.defs
    dest: "{{ hardening_backup_root }}/{{ hardening_backup_timestamp }}/login.defs.bak"
    remote_src: true
    mode: "0600"

- name: "03 apply: ENCRYPT_METHOD SHA512"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*ENCRYPT_METHOD\s+'
    line: "ENCRYPT_METHOD SHA512"

- name: "03 apply: PASS_MAX_DAYS"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*PASS_MAX_DAYS\s+'
    line: "PASS_MAX_DAYS 365"

- name: "03 precheck: pwquality config path exists (package may not be installed)"
  ansible.builtin.stat:
    path: /etc/security/pwquality.conf
  register: pwquality_stat

- name: "03 backup: pwquality.conf (only if present)"
  ansible.builtin.copy:
    src: /etc/security/pwquality.conf
    dest: "{{ hardening_backup_root }}/{{ hardening_backup_timestamp }}/pwquality.conf.bak"
    remote_src: true
    mode: "0600"
  when: pwquality_stat.stat.exists

- name: "03 apply: minlen 14 (only if pwquality is present — do not install new packages here)"
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*minlen\s*='
    line: "minlen = 14"
  when: pwquality_stat.stat.exists
